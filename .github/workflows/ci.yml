name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The toolchain cannot be pinned: as of 2026-11-16 upstream only publishes the
# `latest` alias — every versioned path (binaries/<version>/..., cores/core-<version>)
# answers 403, and neither install script documents version selection. Drift is
# surfaced by the "Show toolchain versions" step instead. The build that was last
# verified locally is 0.1.20261117 (moonc v0.10.21).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers the aarch64 ABI baseline, the
        # platform-independent suites (source-FMU export compiles for the
        # host, ABI fixtures build with clang) and the corpus FMUs — the
        # Reference-FMUs corpus ships aarch64-linux binaries and 0.7.0
        # maps FMI 2 arm64 hosts to `binaries/aarch64-linux/` so every
        # suite runs natively. Tests that need platform binaries on an
        # architecture the corpus does not ship can opt out via
        # MOONFMI_TEST_SKIP_PLATFORM_BINARIES=1 (corpus_skip helper).
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Show toolchain versions
        run: moon version --all

      # A fresh runner ships with an empty mooncakes index; without this,
      # `moon run` cannot resolve even version-pinned registry dependencies
      # ("module was not found in the registry").
      - name: Update the mooncakes registry index
        run: moon update

      - name: Fetch and verify test FMUs
        run: moon run tests/data/fetch-fmus.mbtx --target native

      - name: Run the quality gate
        run: moon run scripts/check.mbtx --target native

      - name: Reject a dirty tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::generated files are out of date; run moon info && moon fmt"
            exit 1
          fi
